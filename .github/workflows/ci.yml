name: CI

on:
  push:
  pull_request:
    branches: [main, master]

jobs:
  # OEE workspace: line-simulator, nodes, oee-aggregator, features-cli.
  # Since week 3 the workspace depends on the fork by path (nodes -> microflow,
  # bridge D6): the submodule must be checked out here too.
  workspace:
    runs-on: ubuntu-latest
    steps:
      # v6 uses Node.js 24 (avoids the Node 20 deprecation on GitHub runners)
      - uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Install Rust
        uses: dtolnay/rust-toolchain@1.96.1
        with:
          components: rustfmt, clippy

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2.9.1

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Tests
        run: cargo test --workspace
        # Includes the simulator determinism integration test (two runs -> empty diff).

  # microflow-rs fork: build, tests, #[model] examples on the host.
  # Separate job: its own workspace and dependencies (nalgebra via a git patch).
  fork:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: fork/microflow
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Install Rust
        uses: dtolnay/rust-toolchain@1.96.1
        with:
          components: rustfmt, clippy

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2.9.1
        with:
          workspaces: fork/microflow

      - name: Check formatting
        run: cargo fmt --all -- --check

      # mismatched_lifetime_syntaxes is a known warning in the upstream-generated
      # tflite_generated.rs (a new rustc lint); everything else is strict.
      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings -A mismatched_lifetime_syntaxes

      - name: Tests
        run: cargo test --release

      # Functional smoke: predict() on the host (week-1 gate).
      - name: Run examples (sine, dense_spike)
        run: |
          cargo run --release --example sine
          cargo run --release --example dense_spike

  # Hardware track (decompose S0): build-only under the Xtensa toolchain —
  # firmwares have no host-run tests (a human verifies on hardware); the
  # host-testable logic lives in the firmware libs and runs in the
  # firmware-host job below.
  firmware:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: firmware
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Install espup and the Xtensa toolchain
        run: |
          # Pinned: the toolchain must match the one the released images
          # were built with (review card 20260909120031).
          cargo install espup --version 0.17.1 --locked
          espup install
          . ${HOME}/export-esp.sh

      # esp's cargo resolves `rustc` via PATH: without the prepend it would
      # run the runner's preinstalled stable rustc and fail on the -Z
      # build-std flags (the toolchain must match — both cargo and rustc esp).
      - name: Build firmware (xtensa-esp32s3-none-elf)
        run: |
          . ${HOME}/export-esp.sh
          export PATH="${HOME}/.rustup/toolchains/esp/bin:${PATH}"
          # Release: the profile we actually flash (review card
          # 20260909120031) — the debug build never exercised LTO.
          cargo build --release \
            -p firmware-a -p firmware-q -p firmware-p \
            --target xtensa-esp32s3-none-elf

  # The host-testable half of the firmware workspace: pure node logic
  # (window/hysteresis/debounce, line formats, the model parity fixtures)
  # and the bench tools (capture converter, UART bridge).
  firmware-host:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: firmware
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Install Rust
        uses: dtolnay/rust-toolchain@1.96.1
        with:
          components: rustfmt, clippy

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2.9.1
        with:
          workspaces: firmware

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings -A mismatched_lifetime_syntaxes

      - name: Tests
        run: cargo test --workspace
