[package]
name = "firmware-p"
description = "Node P firmware (Performance): TCRT5000 -> edge + 50 ms debounce -> counting"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[dependencies]
board = { workspace = true }
fmt-util = { workspace = true }

# The on-target half (see a/Cargo.toml). No model on this node: pure GPIO.
[target.'cfg(target_arch = "xtensa")'.dependencies]
esp-hal = { version = "1.2", features = ["esp32s3", "unstable"] }
# The ESP-IDF app descriptor (esp_app_desc! in main.rs): required by the
# 2nd-stage bootloader; espflash >= 4.6 refuses a descriptor-less image.
esp-bootloader-esp-idf = { version = "0.6", features = ["esp32s3"] }
