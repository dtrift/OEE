[workspace]
resolver = "2"
members = ["board", "a", "q", "p"]

# A workspace separate from the root OEE one (precedent: fork/microflow):
# firmwares build with the espup xtensa-esp32s3-none-elf toolchain and must
# not enter the host CI of the root workspace. The skeleton compiles on the
# host without the esp toolchain (see README.md).

[workspace.package]
edition = "2021"
version = "0.1.0"
license = "MIT OR Apache-2.0"
