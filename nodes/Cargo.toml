[package]
name = "nodes"
description = "A/P/Q nodes: data ingestion, feature extraction, inference, publishing (weeks 4-5)"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[dependencies]
# Week 3 (D6) bridge: inference through the local microflow fork. The
# [patch.crates-io] nalgebra quirk is duplicated in the workspace root
# Cargo.toml (a patch from a path dependency's manifest is not applied).
microflow = { path = "../fork/microflow" }
features-cli = { path = "../features-cli" }
# The same nalgebra the fork uses (redirected to the fork's git patch by the
# workspace-level [patch.crates-io]).
nalgebra = { version = "0.32", default-features = false, features = ["macros"] }
# Week 4 (D1): the run/tap CSV sources.
csv = { workspace = true }
# Week 4 (D0/D2, deviation): MQTT publishing over the minimal own client
# (rumqttc is not fetchable offline — see docs/…/week4-gate.md).
mqtt-min = { path = "../mqtt-min" }
# The node CLI (bin): argument parsing + error reporting.
clap = { workspace = true }
anyhow = { workspace = true }

[dev-dependencies]
# Integration tests regenerate the simulator streams in-process.
line-simulator = { path = "../line-simulator" }
# The interp reference for the microflow-vs-float parity check.
exporter = { path = "../ml/exporter" }
