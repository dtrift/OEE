[workspace]
resolver = "2"
members = [
    "line-simulator",
    "nodes",
    "oee-aggregator",
    "features-cli",
]
# fork/microflow — отдельный workspace (свой [workspace] и [patch]);
# подключается path-зависимостью, в members не входит.

[workspace.package]
edition = "2021"
version = "0.1.0"
license = "MIT OR Apache-2.0"

[workspace.dependencies]
rand = "0.9"
rand_distr = "0.5"
serde = { version = "1", features = ["derive"] }
toml = "0.9"
csv = "1.3"
clap = { version = "4", features = ["derive"] }
anyhow = "1"

# Патч nalgebra из форка microflow: [patch] из манифеста path-зависимости
# игнорируется — продублировать здесь, когда крейты workspace начнут зависеть
# от fork/microflow (неделя 3, узлы). Пока зависимости нет — патч даёт warning
# «was not used» и закомментирован.
# [patch.crates-io]
# nalgebra = { git = "https://github.com/matteocarnelos/nalgebra" }

[profile.release]
lto = true
