[workspace]
resolver = "2"
members = [
    "line-simulator",
    "nodes",
    "oee-aggregator",
    "oee-dashboard",
    "features-cli",
    "ml/exporter",
    "ml/trainer",
    "mqtt-min",
]
# fork/microflow is a separate workspace (its own [workspace] and [patch]);
# it is wired in as a path dependency and is not a member here — `exclude`
# keeps cargo from seeing two workspace roots in one tree.
# qemu is excluded for the same reason: it is a no_std thumbv7m package
# (LM3S6965 firmware) that must not enter host workspace builds.
exclude = ["fork", "qemu"]

[workspace.package]
edition = "2021"
version = "0.1.0"
license = "MIT OR Apache-2.0"

[workspace.dependencies]
rand = "0.9"
rand_distr = "0.5"
serde = { version = "1", features = ["derive"] }
toml = "0.9"
csv = "1.3"
clap = { version = "4", features = ["derive"] }
anyhow = "1"
# Rust-ML track (Д0): burn pinned to the fresh stable line; trainer-only
# dependency — building it needs the network, everything else stays offline.
# Features: ndarray backend + the autodiff wrapper (a separate crate since
# burn 0.19) + std. No "train"/"dataset": the training loop is manual.
burn = { version = "0.21.0", default-features = false, features = ["ndarray", "autodiff", "std"] }

# The nalgebra patch from the microflow fork: [patch] sections of a path
# dependency's manifest are ignored — it is duplicated here once workspace
# crates start depending on fork/microflow (week 3, nodes; see fork/NOTES.md).
[patch.crates-io]
nalgebra = { git = "https://github.com/matteocarnelos/nalgebra" }

[profile.release]
lto = true
