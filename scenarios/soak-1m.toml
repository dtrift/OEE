# The 1M-message scenario (week 6, user request): ~12 h of simulated time
# with the belt and tap periods tightened to 150 ms — ~1 060 000 messages
# on oee/line1/# (the measured soak rate of 99 787 per 3 h at 400 ms,
# scaled by 400/150 and by the duration). Release binaries for the replay
# (RELEASE=1 or the docs/eng|rus/soak.md launch-2 block).
#
# WHY NOT JUST 30 HOURS OF soak.toml: the simulator's carrier phase is
# computed in f32 seconds (`sin(2*pi*f*t)`, line-simulator/src/signal.rs)
# and loses precision with t — measured on a 30 h run, node A flapped
# 600-4800 times per hour from hour ~14 on (vs 2-6/h in the clean zone)
# and the measured Availability collapsed to 0.59 against a ~0.92 truth.
# Twelve hours stays inside the clean window; the missing volume comes
# from density instead. Artifacts ~2.2 GB (run.csv ~1.35 GB, taps.csv
# ~0.99 GB) — check the disk first.
#
# NOTE on P: the bench aggregator's ideal cycle stays 400 ms
# (scripts/bench.sh) while parts arrive every ~158 ms, so the measured
# Performance clamps to 1.000 — for a meaningful P run the aggregator with
# --ideal-cycle-ms 150. A and Q stay meaningful as-is.

duration_ms = 43200000

[[events]]
t_ms = 2000
state = "Run"

