# "Jam cycle" scenario: long jam/overload episodes alternating with runs.
# Dataset seed material for week 3 (D4): the week-2 scenarios keep jam
# episodes at 300-400 ms (~1% of windows), which is too thin for training —
# this scenario enriches exactly the minority classes.

duration_ms = 60000

[[events]]
t_ms = 2000
state = "Run"

[[events]]
t_ms = 8000
state = "Jam"

[[events]]
t_ms = 12000
state = "Run"

[[events]]
t_ms = 18000
state = "Overload"

[[events]]
t_ms = 21000
state = "Run"

[[events]]
t_ms = 27000
state = "Jam"

[[events]]
t_ms = 31000
state = "Run"

[[events]]
t_ms = 37000
state = "Overload"

[[events]]
t_ms = 40000
state = "Run"

[[events]]
t_ms = 46000
state = "Jam"

[[events]]
t_ms = 50000
state = "Run"

[[events]]
t_ms = 56000
