# Week-5 experiment scenario 3 of 4: "slowdown" — the belt runs slower than
# the nominal 400 ms cadence (520 ms actual). The truth: P ~ 400/520 ~ 0.77
# while A stays high; the aggregator is run with the NOMINAL ideal cycle
# (400 ms) — the ideal is a line property, not a scenario parameter.

duration_ms = 60000

[[events]]
t_ms = 2000
state = "Run"

[[events]]
t_ms = 22000
state = "Jam"

[[events]]
t_ms = 22400
state = "Run"

[[events]]
t_ms = 42000
state = "Overload"

[[events]]
t_ms = 42400
state = "Run"

[[events]]
t_ms = 58000
state = "Idle"

[envelope]
idle = 0.4
run = 2.0
jam = 3.2
overload = 4.5

[noise]
sigma_a = 0.12

[taps]
period_ms = 400
crack_probability = 0.1

[belt]
period_ms = 520
jitter = 0.12
double_probability = 0.1
skip_probability = 0.05
