# The message-load scenario (week 6, user request): the same densities as
# week5/normal.toml, stretched to 3 h of simulated time — ~100 000 messages
# on oee/line1/# (parts ~25.6k + taps ~27k, roughly doubled by the
# aggregator's republishes). A soak test of the bench broker/aggregator,
# NOT a demo scenario: the replay flies by in tens of seconds, and the
# artifacts weigh ~0.6 GB (run.csv ~300 MB, taps.csv ~240 MB) — see the
# run notes in the week-6 gate.
#
# The state events are spread over the whole timeline: node A publishes
# only on confirmed status changes, so bunched events would silence it for
# hours (P and Q keep streaming regardless — they dominate the count).

duration_ms = 10800000

